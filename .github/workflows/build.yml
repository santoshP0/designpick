name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package ZIP
        run: npm run zip

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: designpick-dist-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: designpick-zip-${{ github.sha }}
          path: designpick-*.zip
          retention-days: 14
